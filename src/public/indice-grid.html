<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Índice de actuaciones</title>
<style>
  :root{
    --azul-oscuro:#006e6e; --azul:#008080; --azul-claro:#008f8f; --azul-palido:#e3f4f4;
  }
  *{box-sizing:border-box}
  body{
    font-family:'Segoe UI',Arial,Helvetica,sans-serif;margin:0;padding:0 0 60px;
    color:#1a2e2e;background:#f4f7fb;
  }
  header{
    background:linear-gradient(135deg,var(--azul-oscuro),var(--azul));
    color:#fff;padding:22px 32px;display:flex;align-items:center;gap:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  header .escudo{font-size:34px;line-height:1}
  header .titulos{flex:1;min-width:0}
  header .numero-expte{font-size:12px;font-weight:600;color:#a9ecec;letter-spacing:.4px;margin-bottom:2px}
  header h1{font-size:19px;font-weight:700;margin:0 0 2px;line-height:1.3}
  header .subtitulo-portal{font-size:12.5px;color:#cff7f7;letter-spacing:.3px}
  .cuerpo{max-width:1400px;margin:0 auto;padding:24px 32px 0}
  .sub{color:#333;font-size:15px;font-weight:600;margin-bottom:2px}
  .aviso{color:#777;font-size:11.5px;margin-bottom:22px}
  .lista{display:flex;flex-direction:column;gap:8px}
  .fila{
    border:1px solid #ddf2f2;border-left:3px solid var(--azul-claro);
    background:#fff;border-radius:6px;padding:10px 16px;display:flex;align-items:center;gap:20px;
    transition:border-color .15s,box-shadow .15s;
  }
  .fila:hover{box-shadow:0 2px 10px rgba(26,107,107,.1)}
  .info{flex:1;min-width:0;text-decoration:none;color:inherit;display:block;cursor:pointer}
  .info:hover .titulo{text-decoration:underline;color:var(--azul)}
  .titulo{font-size:13.5px;font-weight:700;line-height:1.35;color:#1a2e2e}
  .detalle{font-size:12.5px;color:#444;line-height:1.4;margin-top:2px}
  .fecha{font-size:11px;color:#888;margin-top:4px}
  .botones{display:flex;gap:8px;flex-shrink:0}
  .botones button,.botones a{
    width:100px;text-align:center;font-size:12px;font-weight:600;padding:7px 0;border-radius:5px;
    border:1px solid #cfe8e8;background:var(--azul-palido);color:var(--azul-oscuro);text-decoration:none;cursor:pointer;
    font-family:inherit;box-sizing:border-box;
  }
  .botones button:hover,.botones a:hover{background:var(--azul-claro);color:#fff;border-color:var(--azul-claro)}
  .botones button.copiado{background:#dff5e6!important;border-color:#9cd9b0!important;color:#0a6b2c!important}
  footer{
    max-width:1400px;margin:32px auto 0;padding:16px 32px 0;border-top:1px solid #ddf2f2;
    color:#8aabab;font-size:11px;text-align:center;
  }
</style>
</head>
<body>
  <header>
    <div class="escudo">⚖️</div>
    <div class="titulos">
      <div class="numero-expte" id="numero"></div>
      <h1 id="titulo"></h1>
      <div class="subtitulo-portal">Poder Judicial de la Nación · Cámara Nacional de Apelaciones en lo Civil</div>
    </div>
  </header>
  <div class="cuerpo">
    <div class="sub" id="sub"></div>
    <div class="aviso" id="aviso"></div>
    <div class="lista" id="grilla"></div>
    <footer>Cámara Nacional de Apelaciones en lo Civil · Oficina de Sistemas y Tecnología · 2026</footer>
  </div>
  <script src="indice-grid.js"></script>
</body>
</html>
